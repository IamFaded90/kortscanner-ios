name: Byg Kortscanner IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kortscanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Klargør logmappe
        run: mkdir -p build/logs
      - name: Kontrollér repo for private data
        run: python3 scripts/privacy-check.py
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Generér projekt
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee build/logs/xcodegen.log
          xcodebuild -version | tee build/logs/xcode-version.log
          xcodebuild -showBuildSettings -scheme Kortscanner 2>&1 | tee build/logs/settings.log
      - name: Test genkendelse
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > build/devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("build/devices.json")); xs=[x for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")]; print(next((x["udid"] for x in xs if x["name"]=="iPhone 17 Pro Max"), xs[0]["udid"]))')
          echo "$DEVICE" > build/simulator-id.txt
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -scheme Kortscanner -derivedDataPath build/SimulatorData -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/logs/tests.log
      - name: Kontrollér lyst og mørkt layout
        continue-on-error: true
        run: |
          set -e
          DEVICE=$(cat build/simulator-id.txt)
          mkdir -p build/Screenshots
          xcrun simctl install "$DEVICE" build/SimulatorData/Build/Products/Debug-iphonesimulator/Kortscanner.app
          for MODE in dark light; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            for TAB in 1 2; do
              THEME="Mørk"
              if [ "$MODE" = "light" ]; then THEME="Lys"; fi
              xcrun simctl launch --terminate-running-process "$DEVICE" dk.iamfaded90.kortscanner -hasSeenOnboarding YES -screenshotTab "$TAB" -appearance "$THEME" -AppleLanguages '(da)' -AppleLocale da_DK
              sleep 3
              xcrun simctl io "$DEVICE" screenshot "build/Screenshots/$MODE-$TAB.png"
            done
          done
      - name: Byg til iPhone
        run: |
          set -o pipefail
          xcodebuild -scheme Kortscanner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -resultBundlePath build/Build.xcresult CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/logs/build.log
      - name: Pak og kontrollér IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Kortscanner.app build/ipa/Payload/
          plutil -p build/ipa/Payload/Kortscanner.app/Info.plist | tee build/logs/Info-plist.log
          /usr/libexec/PlistBuddy -c 'Print NSCameraUsageDescription' build/ipa/Payload/Kortscanner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ipa/Payload/Kortscanner.app/Info.plist)" = "dk.iamfaded90.kortscanner"
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' build/ipa/Payload/Kortscanner.app/Info.plist)" = "18.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' build/ipa/Payload/Kortscanner.app/PlugIns/KortscannerWidgets.appex/Info.plist)" = "18.1"
          otool -l build/ipa/Payload/Kortscanner.app/Kortscanner > build/logs/load-commands.log
          python3 -c 'import pathlib; s=pathlib.Path("build/logs/load-commands.log").read_text(); blocks=s.split("Load command"); fm=[b for b in blocks if "/FoundationModels.framework/" in b]; assert fm and all("LC_LOAD_WEAK_DYLIB" in b for b in fm), "FoundationModels must be weak-linked for iOS 18"; print("FoundationModels: weak-link bekræftet")'
          cd build/ipa
          zip -qry ../Kortscanner-unsigned.ipa Payload
      - name: Gem IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kortscanner-IPA
          path: build/Kortscanner-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Pak Xcode-projekt og kildekode
        run: zip -qry build/Kortscanner-kildekode.zip Kortscanner KortscannerWidgets Shared Tests scripts Generated project.yml Kortscanner.xcodeproj .github .gitignore README.md -x '*/.DS_Store'
      - name: Gem projekt
        uses: actions/upload-artifact@v4
        with:
          name: Kortscanner-projekt
          path: build/Kortscanner-kildekode.zip
          retention-days: 1
      - name: Gem layoutbilleder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kortscanner-layout
          path: build/Screenshots
          retention-days: 1
      - name: Gem fejllogs og testresultater
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kortscanner-fejllogs
          path: |
            build/logs
            build/*.xcresult
          retention-days: 1

  compatibility-ios18:
    name: Test alternativer på iOS 18
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install xcodegen
      - name: Byg og test med iOS 18 SDK og simulator
        run: |
          set -euo pipefail
          mkdir -p build/logs build/Screenshots
          xcodegen generate
          xcodebuild -version | tee build/logs/xcode-version.log
          xcrun simctl list devices available -j > build/devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("build/devices.json")); xs=[x for k,v in d["devices"].items() if "iOS-18-5" in k for x in v if x["name"].startswith("iPhone")]; print(next((x["udid"] for x in xs if x["name"]=="iPhone 16 Pro Max"), xs[0]["udid"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -scheme Kortscanner -derivedDataPath build/SimulatorData -parallel-testing-enabled NO -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/logs/ios18-tests.log
          xcrun simctl install "$DEVICE" build/SimulatorData/Build/Products/Debug-iphonesimulator/Kortscanner.app
          for MODE in dark light; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            for TAB in 1 2; do
              THEME="Mørk"
              if [ "$MODE" = "light" ]; then THEME="Lys"; fi
              xcrun simctl launch --terminate-running-process "$DEVICE" dk.iamfaded90.kortscanner -hasSeenOnboarding YES -screenshotTab "$TAB" -appearance "$THEME" -AppleLanguages '(da)' -AppleLocale da_DK
              sleep 3
              xcrun simctl io "$DEVICE" screenshot "build/Screenshots/ios18-$MODE-$TAB.png"
            done
          done
      - name: Gem iOS 18-test og layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kortscanner-iOS18-test
          path: |
            build/logs
            build/Tests.xcresult
            build/Screenshots
          retention-days: 1
